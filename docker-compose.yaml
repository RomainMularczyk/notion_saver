services:
  rabbit-mq:
      image: rabbitmq:${RABBITMQ_VERSION}-management
      container_name: rabbitmq
      user: rabbitmq
      ports:
        - "${RABBITMQ_PORT}:5672"
        - "${RABBITMQ_UI_PORT}:15672"
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 30s
        timeout: 5s
        retries: 3
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
        - rabbitmq_logs:/var/log/rabbitmq
        - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      post_start:
        - command:
          - /bin/bash
          - -c
          - |
            until rabbitmqctl import_definitions /etc/rabbitmq/definitions.json; do
              sleep 2 
            done

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  debezium:
    image: debezium/server:${DEBEZIUM_VERSION}
    container_name: debezium
    ports:
      - ${DEBEZIUM_PORT}:8080
    volumes:
      - ./config/debezium:/debezium/conf
      - debezium_data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - 5050:80
    volumes:
      - pgadmin:/root/.pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    ports:
      - ${PROMETHEUS_PORT}:9090
    volumes:
      - prometheus-data:/prometheus

volumes:
  pgdata:
  debezium_data:
  pgadmin:
  redis_data:
  rabbitmq_data:
  rabbitmq_logs:
