debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
# Database connection
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=notion_saver_database_admin
debezium.source.database.password=admin
debezium.source.database.dbname=notion_saver_main_database
debezium.source.topic.prefix=notion_saver
# Decoding plugin (pgoutput is native to PostgreSQL 10+)
debezium.source.plugin.name=pgoutput
# Publication (will be created automatically)
debezium.source.publication.name=debezium_publication
debezium.source.publication.autocreate.mode=all_tables
# Replication slot
debezium.source.slot.name=debezium_slot
# Filters - monitor specific tables only
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.saves
# Sink - RabbitMQ
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbit-mq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=admin
debezium.sink.rabbitmq.connection.password=secret
# Exchange and routing
debezium.sink.rabbitmq.exchange=debezium
debezium.sink.rabbitmq.routingKey=notion_saver.saves
debezium.sink.rabbitmq.ackTimeout=30000
# Message format
debezium.format.key=json
debezium.format.value=json
# Snapshot configuration (initial data capture)
debezium.source.snapshot.mode=initial
